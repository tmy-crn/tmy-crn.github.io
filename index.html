<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("bg.jpg") center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%),
        rgba(0,0,0,0.18);
    }
    .word {
      position: relative;
      z-index: 1;
      display: block;
      width: clamp(200px, 42vw, 430px);
      height: auto;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.7));
    }
    /* the link + zoom live on the SVG anchor, so both react only to the letters */
    .word a {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    .word a:hover { transform: scale(1.06); }
    .word text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 150px;
      letter-spacing: 3px;
    }
    html {
      scroll-behavior: smooth;
    }
    .message-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      min-height: 52vh;
      min-height: 52dvh;
      padding: 1.5rem 1.5rem clamp(2rem, 5vh, 3.5rem) 1.5rem;
      text-align: center;
    }
    .message-text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 54px);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="hero">
    <svg class="word" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <clipPath id="zclip">
          <text x="400" y="72" text-anchor="middle" dominant-baseline="central">zeras</text>
        </clipPath>
      </defs>
      <a href="https://discord.gg/zJE2NZjqwx" xlink:href="https://discord.gg/zJE2NZjqwx"
         target="_top" aria-label="zeras — join the Discord">
        <image href="red.jpg" xlink:href="red.jpg" x="0" y="0" width="800" height="240"
               preserveAspectRatio="xMidYMid slice" clip-path="url(#zclip)" />
      </a>
    </svg>
  </main>

  <section class="message-section" aria-label="message">
    <p class="message-text">i love you all</p>
  </section>
</body>
</html>
