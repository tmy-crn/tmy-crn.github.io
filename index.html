<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("bg.jpg") center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%),
        rgba(0,0,0,0.18);
    }
    .word {
      position: relative;
      z-index: 1;
      display: block;
      width: clamp(200px, 42vw, 430px);
      height: auto;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.7));
    }
    /* the link + zoom live on the SVG anchor, so both react only to the letters */
    .word a {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    .word a:hover { transform: scale(1.06); }
    .word text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 150px;
      letter-spacing: 3px;
    }
    html {
      scroll-behavior: smooth;
    }
    .message-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      min-height: 52vh;
      min-height: 52dvh;
      padding: 1.5rem 1.5rem clamp(2rem, 5vh, 3.5rem) 1.5rem;
      text-align: center;
    }
    .message-text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 54px);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .popup-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: clamp(140px, 35vw, 240px);
      height: clamp(140px, 35vw, 240px);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.6));
    }
    .popup-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      cursor: pointer;
    }
    .popup-overlay.fade-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.15);
      transition: opacity 1.2s ease-in, transform 1.2s ease-in;
      pointer-events: none;
    }
    .popup-overlay img {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      -webkit-user-drag: none;
    }
    /* Red vignette overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(180, 0, 0, 0.75) 100%);
      transition: opacity 0.5s ease;
    }
    /* Mini shining stars container */
    .mini-stars-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9995;
      overflow: hidden;
    }
    .mini-star {
      position: absolute;
      width: var(--size, 32px);
      height: var(--size, 32px);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: twinkleAndFloat var(--duration, 2.4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 0 8px rgba(255, 50, 50, 0.8));
    }
    @keyframes twinkleAndFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      35% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1.1) rotate(var(--rot, 20deg));
      }
      65% {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(0.7) rotate(calc(var(--rot, 20deg) * -1));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(calc(var(--rot, 20deg) * 2));
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="hero">
    <svg class="word" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <clipPath id="zclip">
          <text x="400" y="72" text-anchor="middle" dominant-baseline="central">zeras</text>
        </clipPath>
      </defs>
      <a href="https://discord.gg/zJE2NZjqwx" xlink:href="https://discord.gg/zJE2NZjqwx"
         target="_top" aria-label="zeras — join the Discord">
        <image href="red.jpg" xlink:href="red.jpg" x="0" y="0" width="800" height="240"
               preserveAspectRatio="xMidYMid slice" clip-path="url(#zclip)" />
      </a>
    </svg>
  </main>

  <section class="message-section" aria-label="message">
    <p class="message-text" id="loveText">i love you all</p>
  </section>

  <div class="vignette-overlay" id="vignetteOverlay" aria-hidden="true"></div>
  <div class="mini-stars-container" id="miniStarsContainer" aria-hidden="true"></div>

  <div class="popup-overlay" id="faviconPopup" aria-hidden="true">
    <img src="favicon.svg" id="popupImg" alt="zeras star" />
  </div>

  <script>
    (function () {
      const text = document.getElementById('loveText');
      const popup = document.getElementById('faviconPopup');
      const popupImg = document.getElementById('popupImg');
      const vignette = document.getElementById('vignetteOverlay');
      const starsContainer = document.getElementById('miniStarsContainer');

      let count = 0;
      let hideTimeout = null;
      let isRotated = false;
      let spamClicks = 0;
      let lastClickTime = 0;

      function clearStars() {
        starsContainer.innerHTML = '';
        vignette.style.opacity = '0';
        spamClicks = 0;
      }

      function scheduleFadeOut() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          popup.classList.remove('show');
          popup.classList.add('fade-out');
          clearStars();
        }, 1800);
      }

      function spawnMiniStars(amount) {
        for (let i = 0; i < amount; i++) {
          const star = document.createElement('img');
          star.src = 'favicon.svg';
          star.className = 'mini-star';
          const size = Math.floor(Math.random() * 32) + 20; // 20px to 52px
          const posX = Math.random() * 92 + 4; // 4% to 96%
          const posY = Math.random() * 92 + 4;
          const duration = (Math.random() * 1.6 + 1.4).toFixed(2); // 1.4s to 3s
          const delay = (Math.random() * 0.8).toFixed(2);
          const rot = (Math.random() * 60 - 30).toFixed(0);

          star.style.setProperty('--size', size + 'px');
          star.style.setProperty('--duration', duration + 's');
          star.style.setProperty('--delay', delay + 's');
          star.style.setProperty('--rot', rot + 'deg');
          star.style.left = posX + 'vw';
          star.style.top = posY + 'vh';

          starsContainer.appendChild(star);
        }
      }

      text.addEventListener('click', () => {
        count++;
        if (count === 10) {
          count = 0;
          isRotated = false;
          popupImg.style.transform = 'rotate(0deg)';
          popup.classList.remove('fade-out');
          popup.classList.add('show');
          clearStars();
          scheduleFadeOut();
        }
      });

      popup.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastClickTime < 1000) {
          spamClicks++;
        } else {
          spamClicks = 1;
        }
        lastClickTime = now;

        isRotated = !isRotated;
        popupImg.style.transform = isRotated ? 'rotate(-90deg)' : 'rotate(90deg)';

        // Intensify red vignette based on spam clicks
        const vignetteIntensity = Math.min(spamClicks * 0.15, 0.95);
        vignette.style.opacity = vignetteIntensity.toString();

        // Spawn batches of mini stars across the screen
        const starsToSpawn = Math.min(2 + Math.floor(spamClicks / 2), 7);
        spawnMiniStars(starsToSpawn);

        scheduleFadeOut();
      });
    })();
  </script>
</body>
</html>
