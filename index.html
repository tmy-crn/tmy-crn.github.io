<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zeras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }
    .link {
      position: relative;
      z-index: 1;
      display: block;
      width: min(94vw, 1400px);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease, filter 0.18s ease;
      filter: drop-shadow(0 6px 26px rgba(0, 0, 0, 0.65));
    }
    .link:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 8px 34px rgba(180, 0, 0, 0.35));
    }
    .word {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .zeras {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 400px;
      letter-spacing: 6px;
    }
  </style>
</head>
<body>
  <!-- Background: black rough stone -->
  <svg class="bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter id="blackrock" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.021 0.019" numOctaves="5"
                      seed="12" stitchTiles="stitch" result="noise" />
        <feDiffuseLighting in="noise" surfaceScale="5.5" diffuseConstant="1"
                           lighting-color="#3b3b3b" result="lit">
          <feDistantLight azimuth="235" elevation="40" />
        </feDiffuseLighting>
        <feComponentTransfer in="lit" result="shaped">
          <feFuncR type="gamma" amplitude="1" exponent="1.7" offset="0" />
          <feFuncG type="gamma" amplitude="1" exponent="1.7" offset="0" />
          <feFuncB type="gamma" amplitude="1" exponent="1.7" offset="0" />
        </feComponentTransfer>
      </filter>
      <radialGradient id="vig" cx="50%" cy="46%" r="72%">
        <stop offset="55%" stop-color="#000" stop-opacity="0" />
        <stop offset="100%" stop-color="#000" stop-opacity="0.65" />
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1200" height="800" filter="url(#blackrock)" />
    <rect x="0" y="0" width="1200" height="800" fill="url(#vig)" />
  </svg>

  <!-- Foreground: "zeras" filled with the same texture in red, links to Discord -->
  <a class="link" href="https://discord.gg/zJE2NZjqwx" aria-label="zeras — join the Discord">
    <svg class="word" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="redrock" x="-5%" y="-15%" width="110%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.018" numOctaves="5"
                        seed="12" stitchTiles="stitch" result="noise" />
          <feDiffuseLighting in="noise" surfaceScale="5" diffuseConstant="1.3"
                             lighting-color="#ff2f2f" result="lit">
            <feDistantLight azimuth="235" elevation="46" />
          </feDiffuseLighting>
          <feComponentTransfer in="lit" result="boost">
            <feFuncR type="gamma" amplitude="1.25" exponent="0.85" offset="0" />
            <feFuncG type="gamma" amplitude="1" exponent="1.5" offset="0" />
            <feFuncB type="gamma" amplitude="1" exponent="1.5" offset="0" />
          </feComponentTransfer>
          <feComposite in="boost" in2="SourceAlpha" operator="in" />
        </filter>
      </defs>
      <text x="600" y="338" text-anchor="middle" class="zeras" filter="url(#redrock)">zeras</text>
    </svg>
  </a>
</body>
</html>
