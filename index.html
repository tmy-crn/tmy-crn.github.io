<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 0;
      overflow: hidden;
    }
    .bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(0.9);         /* unzoom a little */
      transform-origin: center;
      /* fade the outer edges into the black body so the unzoom has no hard seam */
      -webkit-mask-image: radial-gradient(140% 140% at 50% 50%, #000 80%, transparent 100%);
              mask-image: radial-gradient(140% 140% at 50% 50%, #000 80%, transparent 100%);
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%),
        rgba(0,0,0,0.15);
    }
    .word {
      position: relative;
      z-index: 1;
      display: block;
      width: clamp(200px, 42vw, 430px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.7));
    }
    .word a { cursor: pointer; }
    .word image { transition: filter 0.18s ease; }
    .word a:hover image { filter: brightness(1.12); }
    .word text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 150px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><img src="bg.jpg" alt="" /></div>

  <svg class="word" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <clipPath id="zclip">
        <text x="400" y="107" text-anchor="middle" dominant-baseline="central">zeras</text>
      </clipPath>
    </defs>
    <a href="https://discord.gg/zJE2NZjqwx" xlink:href="https://discord.gg/zJE2NZjqwx"
       target="_top" aria-label="zeras — join the Discord">
      <image href="red.jpg" xlink:href="red.jpg" x="0" y="0" width="800" height="240"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#zclip)" />
    </a>
  </svg>
</body>
</html>
