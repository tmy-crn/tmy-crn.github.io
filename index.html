<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="slash1_strip.png" as="image" />
  <link rel="preload" href="slash2_strip.png" as="image" />
  <link rel="preload" href="slash3_strip.png" as="image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; text-transform: lowercase; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("bg.jpg") center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%),
        rgba(0,0,0,0.18);
    }
    .word {
      position: relative;
      z-index: 1;
      display: block;
      width: clamp(200px, 42vw, 430px);
      height: auto;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.7));
    }
    /* the link + zoom live on the SVG anchor, so both react only to the letters */
    .word a {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    .word a:hover { transform: scale(1.06); }
    .word text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 150px;
      letter-spacing: 3px;
    }
    html {
      scroll-behavior: smooth;
    }
    .message-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      min-height: 52vh;
      min-height: 52dvh;
      padding: 1.5rem 1.5rem clamp(2rem, 5vh, 3.5rem) 1.5rem;
      text-align: center;
    }
    .message-text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 54px);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Star popup: fixed spawn position inside message-section */
    .popup-overlay {
      position: absolute;
      top: clamp(20px, 2.5vh, 36px);
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: clamp(140px, 35vw, 240px);
      height: clamp(140px, 35vw, 240px);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .popup-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      cursor: pointer;
    }
    .popup-overlay.fade-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.15);
      transition: opacity 1.2s ease-in, transform 1.2s ease-in;
      pointer-events: none;
    }
    .popup-overlay img#popupImg {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.6));
    }
    /* Red vignette overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(180, 0, 0, 0.75) 100%);
      transition: opacity 1.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Mini shining stars container */
    .mini-stars-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9995;
      overflow: hidden;
    }
    .mini-star {
      position: absolute;
      width: var(--size, 26px);
      height: var(--size, 26px);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: twinkleAndFloat var(--duration, 2.4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      filter: brightness(0.6) sepia(1) hue-rotate(320deg) saturate(9) drop-shadow(0 0 6px rgba(160, 0, 0, 0.9));
    }
    @keyframes twinkleAndFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      35% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.05) rotate(var(--rot, 20deg));
      }
      65% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.65) rotate(calc(var(--rot, 20deg) * -1));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(calc(var(--rot, 20deg) * 2));
      }
    }
    /* Clicker UI in bottom right */
    .clicker-hud {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.8rem;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .clicker-hud.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .clicker-counter {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 0, 0, 0.82);
      border: 1.5px solid rgba(255, 40, 40, 0.55);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .clicker-mouse-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 0 7px rgba(255, 0, 0, 0.9));
    }
    .clicker-count-text {
      font-size: 38px;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 50, 50, 0.9);
      line-height: 1;
    }
    .clicker-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .clicker-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .clicker-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .clicker-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    /* Total CPS HUD in bottom left */
    .total-cps-hud {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(15, 0, 0, 0.82);
      border: 1.5px solid rgba(255, 40, 40, 0.55);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .total-cps-hud.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .total-cps-text {
      font-size: 28px;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 50, 50, 0.9);
      line-height: 1;
    }
    /* Animated auto-clicking mouse cursor (attached relative to the popup star) */
    .flying-clicker-mouse {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 10000;
      filter: none;
      animation: flyAndClick 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flyAndClick {
      0% {
        opacity: 0;
        transform: translate(-50px, 25px) rotate(-25deg) scale(0.8);
      }
      35% {
        opacity: 0.95;
        transform: translate(-18px, 9px) rotate(-12deg) scale(1);
      }
      65% {
        /* Press clicking right on the inner left edge of the star */
        opacity: 1;
        transform: translate(0px, 0px) rotate(0deg) scale(0.9);
      }
      80% {
        opacity: 0.8;
        transform: translate(-3px, -3px) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-10px, -8px) rotate(8deg) scale(0.7);
      }
    }
    /* Lasgun firing muzzle flash */
    .lasgun-muzzle-flash {
      position: fixed;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 20%, #ff1133 60%, transparent 100%);
      transform: translate(-50%, -50%);
      z-index: 10002;
      pointer-events: none;
      box-shadow: 0 0 20px 8px rgba(255, 0, 50, 0.9);
      animation: muzzleAnim 0.12s ease-out forwards;
    }
    @keyframes muzzleAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    }
    /* Lasgun high-energy beam tracer */
    .lasgun-tracer {
      position: fixed;
      top: 0;
      left: 0;
      width: 4px;
      background: linear-gradient(to top, rgba(255, 0, 50, 0) 0%, #ff2244 25%, #ffffff 85%, #ffffff 100%);
      border-radius: 3px;
      z-index: 10001;
      pointer-events: none;
      transform-origin: top center;
      box-shadow:
        0 0 6px 2px #ffffff,
        0 0 16px 5px #ff0033,
        0 0 28px 8px rgba(255, 0, 0, 0.7);
      animation: lasgunFlash 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes lasgunFlash {
      0% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(0.1);
      }
      25% {
        opacity: 1;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
      65% {
        opacity: 0.9;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
    }
    /* Lasgun impact flash on star */
    .laser-impact-flash {
      position: fixed;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 25%, #ff1133 60%, rgba(255, 0, 0, 0) 100%);
      transform: translate(-50%, -50%) scale(0.4);
      z-index: 10003;
      pointer-events: none;
      box-shadow: 0 0 30px 12px rgba(255, 20, 20, 0.95);
      animation: impactFlashAnim 0.24s ease-out forwards;
    }
    @keyframes impactFlashAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.6); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); }
    }
    /* Star chunks that fly off on laser hit */
    .star-chunk {
      position: fixed;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 10002;
      filter: brightness(1.2) sepia(1) hue-rotate(320deg) saturate(9) drop-shadow(0 0 8px rgba(255, 30, 30, 0.95));
    }
    @keyframes chunkFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      60% {
        opacity: 0.9;
        transform: translate(var(--cx), var(--cy)) rotate(var(--cr)) scale(0.85);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--cx) * 1.3), calc(var(--cy) + 90px)) rotate(calc(var(--cr) * 1.5)) scale(0.2);
      }
    }
    /* Laser buy button style */
    .laser-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .laser-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .laser-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .laser-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    .i-dot {
      cursor: pointer;
      display: inline-block;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .i-dot:hover {
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
    }
    /* Star bounce animation on hit/click */
    @keyframes starBounceAnim {
      0% { transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg)); }
      35% { transform: scale(calc(var(--base-scale, 1) * 0.88)) rotate(var(--base-rot, 0deg)); }
      70% { transform: scale(calc(var(--base-scale, 1) * 1.08)) rotate(var(--base-rot, 0deg)); }
      100% { transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg)); }
    }
    .popup-overlay img#popupImg.bouncing {
      animation: starBounceAnim 0.18s ease-out forwards;
    }
    /* Eye Slash Sprite Animation (RED SLASH 1, 2, 3) */
    .eye-slash-wrap {
      position: fixed;
      z-index: 10005;
      pointer-events: none;
      transform-origin: center center;
      overflow: hidden;
      filter: drop-shadow(0 0 16px rgba(255, 0, 30, 0.95)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.7));
    }
    .eye-slash-strip {
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      display: block;
      pointer-events: none;
    }
    .strip-9 {
      width: 900%;
      max-width: none;
      animation: playSlashStrip9 0.28s steps(9) forwards;
    }
    .strip-7 {
      width: 700%;
      max-width: none;
      animation: playSlashStrip7 0.24s steps(7) forwards;
    }
    @keyframes playSlashStrip9 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    @keyframes playSlashStrip7 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .eye-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .eye-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .eye-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .eye-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    /* Hands Upgrade - Pixelated Hands Animation & Styles */
    .hands-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .hands-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .hands-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .hands-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    .pixel-hands-container {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 0;
      height: 0;
      top: 0;
      left: 0;
    }
    .pixel-hand {
      position: absolute;
      top: 0;
      left: 0;
      width: 84px;
      height: 103px;
      margin-left: -42px;
      margin-top: -51px;
      pointer-events: none;
      image-rendering: pixelated;
      transform-origin: center center;
    }
    .pixel-hand-left {
      animation: handLeftCrush 0.88s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .pixel-hand-right {
      animation: handRightCrush 0.88s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    /* left hand = the cursor mirrored, pointing up */
    @keyframes handLeftCrush {
      0% {
        opacity: 0;
        transform: translate(-150px, 10px) scaleX(-1) scale(0.4);
        filter: blur(3px) brightness(0.4);
      }
      35% {
        opacity: 0.95;
        transform: translate(-70px, 0px) scaleX(-1) scale(1.15);
        filter: blur(0px) brightness(1) drop-shadow(0 0 12px rgba(255, 0, 30, 0.7));
      }
      50% {
        opacity: 1;
        transform: translate(-40px, 0px) scaleX(-1) scale(1.0);
        filter: drop-shadow(0 0 22px rgba(255, 0, 0, 1));
      }
      72% {
        opacity: 0.95;
        transform: translate(-42px, 0px) scaleX(-1) scale(1.02);
        filter: drop-shadow(0 0 14px rgba(255, 0, 0, 0.8));
      }
      100% {
        opacity: 0;
        transform: translate(-72px, 4px) scaleX(-1) scale(1.12);
        filter: blur(2px) opacity(0);
      }
    }
    /* right hand = the cursor as-is, pointing up */
    @keyframes handRightCrush {
      0% {
        opacity: 0;
        transform: translate(150px, 10px) scale(0.4);
        filter: blur(3px) brightness(0.4);
      }
      35% {
        opacity: 0.95;
        transform: translate(70px, 0px) scale(1.15);
        filter: blur(0px) brightness(1) drop-shadow(0 0 12px rgba(255, 0, 30, 0.7));
      }
      50% {
        opacity: 1;
        transform: translate(40px, 0px) scale(1.0);
        filter: drop-shadow(0 0 22px rgba(255, 0, 0, 1));
      }
      72% {
        opacity: 0.95;
        transform: translate(42px, 0px) scale(1.02);
        filter: drop-shadow(0 0 14px rgba(255, 0, 0, 0.8));
      }
      100% {
        opacity: 0;
        transform: translate(72px, 4px) scale(1.12);
        filter: blur(2px) opacity(0);
      }
    }
    /* Star crush squish reaction */
    @keyframes starCrushAnim {
      0% {
        transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg));
      }
      30% {
        /* Tight horizontal crush squeeze */
        transform: scale(calc(var(--base-scale, 1) * 0.45), calc(var(--base-scale, 1) * 1.45)) rotate(calc(var(--base-rot, 0deg) - 4deg));
        filter: drop-shadow(0 0 35px rgba(255, 0, 0, 1)) brightness(1.6);
      }
      65% {
        /* Spring back stretch */
        transform: scale(calc(var(--base-scale, 1) * 1.25), calc(var(--base-scale, 1) * 0.75)) rotate(calc(var(--base-rot, 0deg) + 3deg));
      }
      100% {
        transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg));
      }
    }
    .popup-overlay img#popupImg.crushed {
      animation: starCrushAnim 0.38s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    /* Red shockwave from crushing impact */
    .crush-shockwave {
      position: fixed;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #ff2244;
      background: radial-gradient(circle, rgba(255, 0, 40, 0.55) 0%, rgba(255, 0, 0, 0) 70%);
      transform: translate(-50%, -50%) scale(0.2);
      z-index: 10003;
      pointer-events: none;
      box-shadow: 0 0 25px 8px rgba(255, 0, 30, 0.95);
      animation: crushWaveAnim 0.35s ease-out forwards;
    }
    @keyframes crushWaveAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(3.5); }
    }
    /* Reset Confirmation Modal */
    .reset-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .reset-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .reset-modal-box {
      background: rgba(20, 0, 0, 0.95);
      border: 2px solid #ff2233;
      border-radius: 14px;
      padding: 1.8rem 2.2rem;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 0, 0, 0.5);
      font-family: 'Jacquard 12', 'Times New Roman', serif;
    }
    .reset-modal-title {
      font-size: 32px;
      color: #fff;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 12px rgba(255, 40, 40, 0.9);
    }
    .reset-modal-desc {
      font-size: 20px;
      color: rgba(255, 200, 200, 0.8);
      margin-bottom: 1.5rem;
    }
    .reset-modal-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .reset-confirm-btn, .reset-cancel-btn {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 22px;
      padding: 0.5rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-confirm-btn {
      background: #880000;
      border: 1.5px solid #ff3333;
      color: #fff;
    }
    .reset-confirm-btn:hover {
      background: #cc0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
    }
    .reset-cancel-btn {
      background: rgba(40, 40, 40, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #ccc;
    }
    .reset-cancel-btn:hover {
      background: rgba(70, 70, 70, 0.9);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="hero">
    <svg class="word" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <clipPath id="zclip">
          <text x="400" y="72" text-anchor="middle" dominant-baseline="central">zeras</text>
        </clipPath>
      </defs>
      <a href="https://discord.gg/zJE2NZjqwx" xlink:href="https://discord.gg/zJE2NZjqwx"
         target="_blank" rel="noopener noreferrer" aria-label="zeras — join the Discord">
        <image href="red.jpg" xlink:href="red.jpg" x="0" y="0" width="800" height="240"
               preserveAspectRatio="xMidYMid slice" clip-path="url(#zclip)" />
      </a>
    </svg>
  </main>

  <section class="message-section" aria-label="message">
    <div class="popup-overlay" id="faviconPopup" aria-hidden="true">
      <img src="favicon.svg" id="popupImg" alt="zeras star" />
    </div>
    <p class="message-text" id="loveText"><span id="iDot" class="i-dot">i</span> love you all</p>
  </section>

  <div class="vignette-overlay" id="vignetteOverlay" aria-hidden="true"></div>
  <div class="mini-stars-container" id="miniStarsContainer" aria-hidden="true"></div>

  <!-- Clicker HUD in right corner -->
  <div class="clicker-hud" id="clickerHud" aria-hidden="true">
    <div class="clicker-counter">
      <img src="CLICKER.cur" class="clicker-mouse-icon" alt="mouse clicker" />
      <span class="clicker-count-text" id="starCountDisplay">0</span>
    </div>
    <button class="clicker-buy-btn" id="buyClickerBtn">
      <span>+1 mouse (<span id="autoClickerCost">100</span>)</span>
    </button>
    <div class="clicker-cps-text" id="cpsDisplay">0 clickers (0/s)</div>
    <button class="laser-buy-btn" id="buyLaserBtn" style="display:none;">
      <span>+1 laser (<span id="laserCost">1000</span>)</span>
    </button>
    <div class="laser-cps-text" id="laserDisplay" style="display:none;">0 lasers (0/s)</div>
    <button class="eye-buy-btn" id="buyEyeBtn" style="display:none;">
      <span>+1 eye (<span id="eyeCost">6000</span>)</span>
    </button>
    <div class="eye-cps-text" id="eyeDisplay" style="display:none;">0 eyes (0/s)</div>
    <button class="hands-buy-btn" id="buyHandsBtn" style="display:none;">
      <span>+1 hands (<span id="handsCost">24000</span>)</span>
    </button>
    <div class="hands-cps-text" id="handsDisplay" style="display:none;">0 hands (0/s)</div>
  </div>

  <!-- Total CPS HUD in bottom left -->
  <div class="total-cps-hud" id="totalCpsHud" aria-hidden="true">
    <span class="total-cps-text" id="totalCpsDisplay">total: 0 clicks/s</span>
  </div>

  <!-- Reset Confirmation Modal -->
  <div class="reset-modal-overlay" id="resetModal" aria-hidden="true">
    <div class="reset-modal-box">
      <h2 class="reset-modal-title">reset progress?</h2>
      <p class="reset-modal-desc">this will clear your clicks, upgrades, and stats completely.</p>
      <div class="reset-modal-actions">
        <button class="reset-confirm-btn" id="confirmResetBtn">yes, reset</button>
        <button class="reset-cancel-btn" id="cancelResetBtn">cancel</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const text = document.getElementById('loveText');
      const popup = document.getElementById('faviconPopup');
      const popupImg = document.getElementById('popupImg');
      const vignette = document.getElementById('vignetteOverlay');
      const starsContainer = document.getElementById('miniStarsContainer');

      const clickerHud = document.getElementById('clickerHud');
      const countDisplay = document.getElementById('starCountDisplay');
      const buyBtn = document.getElementById('buyClickerBtn');
      const costDisplay = document.getElementById('autoClickerCost');
      const cpsDisplay = document.getElementById('cpsDisplay');

      // Total CPS refs
      const totalCpsHud = document.getElementById('totalCpsHud');
      const totalCpsDisplay = document.getElementById('totalCpsDisplay');

      // Laser refs
      const buyLaserBtn = document.getElementById('buyLaserBtn');
      const laserCostDisplay = document.getElementById('laserCost');
      const laserDisplay = document.getElementById('laserDisplay');

      // Eye refs
      const buyEyeBtn = document.getElementById('buyEyeBtn');
      const eyeCostDisplay = document.getElementById('eyeCost');
      const eyeDisplay = document.getElementById('eyeDisplay');

      // Hands refs
      const buyHandsBtn = document.getElementById('buyHandsBtn');
      const handsCostDisplay = document.getElementById('handsCost');
      const handsDisplay = document.getElementById('handsDisplay');

      // Reset modal refs & i-dot
      const iDot = document.getElementById('iDot');
      const resetModal = document.getElementById('resetModal');
      const confirmResetBtn = document.getElementById('confirmResetBtn');
      const cancelResetBtn = document.getElementById('cancelResetBtn');
      let iDotClicks = 0;
      let iDotTimer = null;
      let isPaused = false;
      let isResetting = false;

      let count = 0;
      let hideTimeout = null;
      let spreeDecayTimer = null;
      let isRotated = false;
      let spamClicks = 0;
      let lastClickTime = 0;

      let starCurrency = 0;
      let totalClicksLifetime = 0;
      let currentDeg = 0;

      // Balance curves (Cookie Clicker standard: ~1.15x cost multiplier per tier)
      // Tier 1: Mouse cursor (+1 click/s) - Base cost 100
      let autoClickers = 0;
      let autoClickerBaseCost = 100;
      let autoClickerCost = 100;
      let autoClickInterval = null;

      // Tier 2: Lasgun beam (+10 clicks/s) - Base cost 1000, unlocks at 750
      let laserCount = 0;
      let laserBaseCost = 1000;
      let laserCurrentCost = 1000;
      let laserInterval = null;

      // Tier 3: Eye sword slash (+50 clicks/s) - Base cost 6000, unlocks at 4500
      let eyeCount = 0;
      let eyeBaseCost = 6000;
      let eyeCurrentCost = 6000;
      let eyeInterval = null;

      // Tier 4: Hands crush (+160 clicks/s) - Base cost 24000, unlocks at 15000
      let handsCount = 0;
      let handsBaseCost = 24000;
      let handsCurrentCost = 24000;
      let handsInterval = null;

      const messageSection = document.querySelector('.message-section');

      // Star bounce animation trigger (throttled to avoid layout thrashing)
      let lastBounceTime = 0;
      function triggerStarBounce() {
        const now = performance.now();
        if (now - lastBounceTime < 90) return;
        lastBounceTime = now;

        let currentScale = 1.0;
        if (totalClicksLifetime >= 50 && totalClicksLifetime < 100) {
          const progress = (totalClicksLifetime - 50) / 50;
          currentScale = 1.0 + (progress * 0.55);
        }
        popupImg.style.setProperty('--base-scale', currentScale);
        popupImg.style.setProperty('--base-rot', `${currentDeg}deg`);

        popupImg.classList.remove('bouncing');
        void popupImg.offsetWidth; // force DOM reflow
        popupImg.classList.add('bouncing');
      }

      // Local storage persistence
      const SAVE_KEY = 'zeras_clicker_save';
      let saveTimeout = null;

      function saveGame() {
        if (isResetting || isPaused) return;
        try {
          const data = {
            starCurrency,
            totalClicksLifetime,
            autoClickers,
            laserCount,
            eyeCount,
            handsCount
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        } catch (err) {}
      }

      function queueSave() {
        if (isResetting || isPaused) return;
        if (saveTimeout) return;
        saveTimeout = setTimeout(() => {
          saveTimeout = null;
          saveGame();
        }, 800);
      }

      function loadGame() {
        try {
          const saved = localStorage.getItem(SAVE_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (typeof data.starCurrency === 'number') starCurrency = Math.max(0, data.starCurrency);
            if (typeof data.totalClicksLifetime === 'number') totalClicksLifetime = Math.max(0, data.totalClicksLifetime);
            if (typeof data.autoClickers === 'number') autoClickers = Math.max(0, data.autoClickers);
            if (typeof data.laserCount === 'number') laserCount = Math.max(0, data.laserCount);
            if (typeof data.eyeCount === 'number') eyeCount = Math.max(0, data.eyeCount);
            if (typeof data.handsCount === 'number') handsCount = Math.max(0, data.handsCount);

            autoClickerCost = Math.round(autoClickerBaseCost * Math.pow(1.15, autoClickers));
            laserCurrentCost = Math.round(laserBaseCost * Math.pow(1.15, laserCount));
            eyeCurrentCost = Math.round(eyeBaseCost * Math.pow(1.15, eyeCount));
            handsCurrentCost = Math.round(handsBaseCost * Math.pow(1.15, handsCount));

            if (autoClickers > 0) startAutoClickerLoop();
            if (laserCount > 0) startLaserLoop();
            if (eyeCount > 0) startEyeLoop();
            if (handsCount > 0) startHandsLoop();

            if (totalClicksLifetime >= 100) {
              popup.classList.remove('fade-out');
              popup.classList.add('show');
            }
          }
        } catch (err) {}
      }

      // Reset modal handling
      function openResetModal() {
        isPaused = true;
        if (autoClickInterval) { clearInterval(autoClickInterval); autoClickInterval = null; }
        if (laserInterval) { clearInterval(laserInterval); laserInterval = null; }
        if (eyeInterval) { clearInterval(eyeInterval); eyeInterval = null; }
        if (handsInterval) { clearInterval(handsInterval); handsInterval = null; }
        resetModal.classList.add('open');
        resetModal.removeAttribute('aria-hidden');
      }

      function closeResetModal() {
        isPaused = false;
        if (autoClickers > 0) startAutoClickerLoop();
        if (laserCount > 0) startLaserLoop();
        if (eyeCount > 0) startEyeLoop();
        if (handsCount > 0) startHandsLoop();
        resetModal.classList.remove('open');
        resetModal.setAttribute('aria-hidden', 'true');
      }

      confirmResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isResetting = true;
        isPaused = true;
        if (autoClickInterval) { clearInterval(autoClickInterval); autoClickInterval = null; }
        if (laserInterval) { clearInterval(laserInterval); laserInterval = null; }
        if (eyeInterval) { clearInterval(eyeInterval); eyeInterval = null; }
        if (handsInterval) { clearInterval(handsInterval); handsInterval = null; }
        if (hideTimeout) clearTimeout(hideTimeout);
        if (spreeDecayTimer) clearTimeout(spreeDecayTimer);
        if (saveTimeout) clearTimeout(saveTimeout);
        starCurrency = 0;
        totalClicksLifetime = 0;
        autoClickers = 0;
        laserCount = 0;
        eyeCount = 0;
        handsCount = 0;
        try {
          localStorage.removeItem(SAVE_KEY);
          localStorage.clear();
        } catch (err) {}
        location.reload();
      });

      cancelResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeResetModal();
      });
      // Pop-up is only dismissed by clicking cancel or yes reset (clicking outside does nothing)

      // Triple click on i-dot to trigger reset confirmation
      iDot.addEventListener('click', (e) => {
        e.stopPropagation();
        iDotClicks++;
        clearTimeout(iDotTimer);
        if (iDotClicks >= 3) {
          iDotClicks = 0;
          openResetModal();
        } else {
          iDotTimer = setTimeout(() => {
            iDotClicks = 0;
          }, 600);
        }
      });

      function updateClickerUI() {
        countDisplay.textContent = Math.floor(starCurrency);
        costDisplay.textContent = autoClickerCost;
        cpsDisplay.textContent = `${autoClickers} mouse clickers (${autoClickers}/s)`;
        buyBtn.disabled = starCurrency < autoClickerCost;

        // Total CPS count for bottom left HUD
        const totalCps = (autoClickers * 1) + (laserCount * 10) + (eyeCount * 50) + (handsCount * 160);
        totalCpsDisplay.textContent = `total: ${totalCps} clicks/s`;

        // Clicker HUD game unlocks at 100 clicks
        if (totalClicksLifetime >= 100) {
          clickerHud.classList.add('active');
          clickerHud.removeAttribute('aria-hidden');
          totalCpsHud.classList.add('active');
          totalCpsHud.removeAttribute('aria-hidden');
        }

        // Show laser button once player hits 750 lifetime clicks
        if (totalClicksLifetime >= 750) {
          buyLaserBtn.style.display = '';
          laserDisplay.style.display = '';
        }
        laserCostDisplay.textContent = laserCurrentCost;
        laserDisplay.textContent = `${laserCount} lasers (${laserCount * 10}/s)`;
        buyLaserBtn.disabled = starCurrency < laserCurrentCost;

        // Show eye button once player hits 4500 lifetime clicks
        if (totalClicksLifetime >= 4500) {
          buyEyeBtn.style.display = '';
          eyeDisplay.style.display = '';
        }
        eyeCostDisplay.textContent = eyeCurrentCost;
        eyeDisplay.textContent = `${eyeCount} eyes (${eyeCount * 50}/s)`;
        buyEyeBtn.disabled = starCurrency < eyeCurrentCost;

        // Show hands button once player hits 15000 lifetime clicks
        if (totalClicksLifetime >= 15000) {
          buyHandsBtn.style.display = '';
          handsDisplay.style.display = '';
        }
        handsCostDisplay.textContent = handsCurrentCost;
        handsDisplay.textContent = `${handsCount} hands (${handsCount * 160}/s)`;
        buyHandsBtn.disabled = starCurrency < handsCurrentCost;

        queueSave();
      }

      function clearStars() {
        starsContainer.innerHTML = '';
        vignette.style.opacity = '0';
        spamClicks = 0;
      }

      function scheduleFadeOut() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          if (autoClickers === 0 && laserCount === 0 && eyeCount === 0 && totalClicksLifetime < 100) {
            popup.classList.remove('show');
            popup.classList.add('fade-out');
            clearStars();
          }
        }, 2200);
      }

      function scheduleSpreeDecay() {
        clearTimeout(spreeDecayTimer);
        spreeDecayTimer = setTimeout(() => {
          vignette.style.opacity = '0';
          spamClicks = 0;
        }, 2000);
      }

      function spawnFlyingMouse() {
        if (document.hidden || isPaused) return;
        // Cap flying mice in DOM to avoid element spam
        if (popup.querySelectorAll('.flying-clicker-mouse').length >= 4) return;

        const mouse = document.createElement('img');
        mouse.src = 'CLICKER.cur';
        mouse.className = 'flying-clicker-mouse';

        // Position relative to the inner left edge of the star inside popup
        const posX = 15 + (Math.random() * 15 - 7.5);
        const posY = 48 + (Math.random() * 20 - 10);

        mouse.style.left = posX + '%';
        mouse.style.top = posY + '%';

        popup.appendChild(mouse);

        setTimeout(() => {
          if (mouse.parentNode) {
            mouse.parentNode.removeChild(mouse);
          }
        }, 800);
      }

      function spawnMiniStars(amount) {
        if (document.hidden || isPaused) return;
        if (starsContainer.children.length > 30) return;

        for (let i = 0; i < amount; i++) {
          const star = document.createElement('img');
          star.src = 'favicon.svg';
          star.className = 'mini-star';
          const size = Math.floor(Math.random() * 24) + 18;
          const posX = Math.random() * 92 + 4;
          const posY = Math.random() * 92 + 4;
          const duration = (Math.random() * 1.6 + 1.4).toFixed(2);
          const delay = (Math.random() * 0.8).toFixed(2);
          const rot = (Math.random() * 60 - 30).toFixed(0);

          star.style.setProperty('--size', size + 'px');
          star.style.setProperty('--duration', duration + 's');
          star.style.setProperty('--delay', delay + 's');
          star.style.setProperty('--rot', rot + 'deg');
          star.style.left = posX + 'vw';
          star.style.top = posY + 'vh';

          starsContainer.appendChild(star);

          // Clean up after animation to prevent unbounded memory/DOM usage
          setTimeout(() => {
            if (star.parentNode) star.parentNode.removeChild(star);
          }, (parseFloat(duration) * 3 + parseFloat(delay)) * 1000);
        }
      }

      function performStarClick(isManual = true) {
        if (isPaused) return;
        starCurrency++;
        totalClicksLifetime++;
        const now = Date.now();

        if (isManual) {
          if (now - lastClickTime < 800) {
            spamClicks++;
          } else {
            spamClicks = 1;
          }
          lastClickTime = now;
          scheduleSpreeDecay();

          // Star scale logic (manual clicks only):
          let currentScale = 1.0;
          if (totalClicksLifetime >= 50 && totalClicksLifetime < 100) {
            const progress = (totalClicksLifetime - 50) / 50;
            currentScale = 1.0 + (progress * 0.55);
          } else {
            currentScale = 1.0;
          }

          // Spin speed & smoothness logic:
          let spinSpeed = 0.35;
          let easing = 'cubic-bezier(0.34, 1.56, 0.64, 1)';

          if (totalClicksLifetime >= 100) {
            const spreeFactor = Math.min(spamClicks / 10, 1);
            spinSpeed = 0.65 - (spreeFactor * 0.50);
            easing = 'cubic-bezier(0.25, 1, 0.5, 1)';
          } else if (totalClicksLifetime >= 50) {
            const progress = (totalClicksLifetime - 50) / 50;
            spinSpeed = 0.35 - (progress * 0.23);
          }

          popupImg.style.transition = `transform ${spinSpeed.toFixed(3)}s ${easing}`;

          // Rotation logic:
          if (totalClicksLifetime < 50) {
            isRotated = !isRotated;
            currentDeg = isRotated ? -90 : 90;
          } else {
            currentDeg += 90;
          }

          popupImg.style.transform = `scale(${currentScale}) rotate(${currentDeg}deg)`;

          // Vignette fades in progressively starting at 50 clicks
          let vignetteIntensity = 0;
          if (totalClicksLifetime >= 50) {
            const baseVignette = Math.min((totalClicksLifetime - 50) / 100, 0.75);
            const spreeBonus = spamClicks >= 2 ? Math.min((spamClicks - 1) * 0.08, 0.25) : 0;
            vignetteIntensity = Math.min(baseVignette + spreeBonus, 0.95);
          } else if (spamClicks >= 2) {
            vignetteIntensity = Math.min((spamClicks - 1) * 0.12, 0.6);
          }
          vignette.style.opacity = vignetteIntensity.toString();

          triggerStarBounce();

          const starsToSpawn = Math.min(2 + Math.floor(spamClicks / 3), 4);
          spawnMiniStars(starsToSpawn);
        } else {
          // Auto-clicker triggers the flying click animation without spinning
          spawnFlyingMouse();
          triggerStarBounce();
        }

        updateClickerUI();
        scheduleFadeOut();
      }

      function startAutoClickerLoop() {
        if (autoClickInterval) clearInterval(autoClickInterval);
        if (autoClickers <= 0 || isPaused) return;
        autoClickInterval = setInterval(() => {
          if (isPaused) return;
          for (let i = 0; i < autoClickers; i++) {
            setTimeout(() => {
              if (!isPaused) performStarClick(false);
            }, (1000 / autoClickers) * i);
          }
        }, 1000);
      }

      buyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (starCurrency >= autoClickerCost) {
          starCurrency -= autoClickerCost;
          autoClickers++;
          autoClickerCost = Math.round(autoClickerBaseCost * Math.pow(1.15, autoClickers));
          startAutoClickerLoop();
          updateClickerUI();
          saveGame();
        }
      });

      // Prevent wheel/touch scrolling on the popup so it doesn't trigger page scrolls
      popup.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
      popup.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      text.addEventListener('click', () => {
        count++;
        if (count === 10) {
          count = 0;
          popup.classList.remove('fade-out');
          popup.classList.add('show');
          scheduleFadeOut();
        }
      });

      popup.addEventListener('click', () => {
        performStarClick(true);
      });

      // --- LASGUN BEAM & SHOT LOGIC ---
      function fireLaser() {
        if (!popup.classList.contains('show') || isPaused) return;

        // Target: random point on the visible star
        const popupRect = popup.getBoundingClientRect();
        const offsetX = (Math.random() - 0.5) * (popupRect.width * 0.55);
        const offsetY = (Math.random() - 0.5) * (popupRect.height * 0.55);
        const targetX = popupRect.left + popupRect.width / 2 + offsetX;
        const targetY = popupRect.top + popupRect.height / 2 + offsetY;

        // Give +10 clicks per shot
        starCurrency += 10;
        totalClicksLifetime += 10;
        updateClickerUI();

        // Skip visual particle effects if tab is in background to save battery/CPU
        if (document.hidden) return;

        // Multiple spawn positions strictly OUTSIDE the viewport near bottom right
        let startX, startY;
        if (Math.random() < 0.55) {
          startX = window.innerWidth - (10 + Math.random() * 260);
          startY = window.innerHeight + 25 + Math.random() * 25;
        } else {
          startX = window.innerWidth + 25 + Math.random() * 25;
          startY = window.innerHeight - (10 + Math.random() * 200);
        }

        const dx = targetX - startX;
        const dy = targetY - startY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angleRad = Math.atan2(dy, dx) - Math.PI / 2;

        // Spawn muzzle flash at the off-screen origin
        const muzzle = document.createElement('div');
        muzzle.className = 'lasgun-muzzle-flash';
        muzzle.style.left = `${startX}px`;
        muzzle.style.top = `${startY}px`;
        document.body.appendChild(muzzle);
        setTimeout(() => {
          if (muzzle.parentNode) muzzle.parentNode.removeChild(muzzle);
        }, 120);

        // High-energy glowing lasgun beam tracer
        const tracer = document.createElement('div');
        tracer.className = 'lasgun-tracer';
        tracer.style.height = `${dist}px`;
        tracer.style.setProperty('--startX', `${startX}px`);
        tracer.style.setProperty('--startY', `${startY}px`);
        tracer.style.setProperty('--angle', `${angleRad}rad`);

        document.body.appendChild(tracer);

        // Impact flash and chunk explosion on the star
        setTimeout(() => {
          const flash = document.createElement('div');
          flash.className = 'laser-impact-flash';
          flash.style.left = `${targetX}px`;
          flash.style.top = `${targetY}px`;
          document.body.appendChild(flash);
          setTimeout(() => {
            if (flash.parentNode) flash.parentNode.removeChild(flash);
          }, 240);

          spawnStarChunks(targetX, targetY);
          triggerStarBounce();
        }, 40);

        // Remove tracer after animation finishes (0.22s duration)
        setTimeout(() => {
          if (tracer.parentNode) tracer.parentNode.removeChild(tracer);
        }, 220);
      }

      function spawnStarChunks(cx, cy) {
        if (document.hidden || isPaused) return;
        // Cap concurrent chunk nodes in DOM to prevent slowdowns
        if (document.querySelectorAll('.star-chunk').length >= 24) return;

        const chunkCount = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < chunkCount; i++) {
          const chunk = document.createElement('img');
          chunk.src = 'favicon.svg';
          chunk.className = 'star-chunk';
          chunk.style.left = cx + 'px';
          chunk.style.top = cy + 'px';

          const angle = Math.random() * Math.PI * 2;
          const dist = 40 + Math.random() * 130;
          const flyX = Math.cos(angle) * dist;
          const flyY = Math.sin(angle) * dist - 30;
          const flyRot = (Math.random() - 0.5) * 540;

          chunk.style.setProperty('--cx', flyX + 'px');
          chunk.style.setProperty('--cy', flyY + 'px');
          chunk.style.setProperty('--cr', flyRot + 'deg');
          chunk.style.animation = `chunkFly ${(0.55 + Math.random() * 0.35).toFixed(2)}s cubic-bezier(0.2, 0.8, 0.4, 1) forwards`;

          document.body.appendChild(chunk);

          setTimeout(() => {
            if (chunk.parentNode) chunk.parentNode.removeChild(chunk);
          }, 950);
        }
      }

      function startLaserLoop() {
        if (laserInterval) clearInterval(laserInterval);
        if (laserCount <= 0 || isPaused) return;
        laserInterval = setInterval(() => {
          if (isPaused) return;
          for (let i = 0; i < laserCount; i++) {
            setTimeout(() => {
              if (!isPaused) fireLaser();
            }, (1000 / laserCount) * i);
          }
        }, 1000);
      }

      // --- EYE SWORD SLASH BUFF LOGIC (7500 clicks, +65 clicks per slash) ---
      function fireEyeSlash() {
        if (!popup.classList.contains('show') || isPaused) return;

        const popupRect = popupImg.getBoundingClientRect();
        const starCenterX = popupRect.left + popupRect.width / 2;
        const starCenterY = popupRect.top + popupRect.height / 2;

        starCurrency += 50;
        totalClicksLifetime += 50;
        updateClickerUI();

        if (document.hidden) return;

        // Randomly pick one of the 3 slash types from the desktop folders (RED SLASH 1, 2, 3)
        const slashType = Math.floor(Math.random() * 3) + 1; // 1, 2, or 3
        const frameCount = slashType === 3 ? 7 : 9;
        const animDuration = slashType === 3 ? 240 : 280;

        // Randomize slash hit position across and around the star
        const maxOffset = Math.min(popupRect.width, popupRect.height) * 0.35;
        const offsetAngle = Math.random() * Math.PI * 2;
        const offsetDist = Math.random() * maxOffset;
        const hitX = starCenterX + Math.cos(offsetAngle) * offsetDist;
        const hitY = starCenterY + Math.sin(offsetAngle) * offsetDist;

        // Scale slash proportionally to star with minor random size variation
        const starSize = Math.max(popupRect.width, 160);
        const slashSize = Math.round(starSize * (1.1 + Math.random() * 0.25));

        // Randomize rotation angle across 360 degrees and horizontal flip
        const randomRot = Math.floor(Math.random() * 360);
        const flipX = Math.random() < 0.5 ? -1 : 1;

        const slashWrap = document.createElement('div');
        slashWrap.className = 'eye-slash-wrap';
        slashWrap.style.width = `${slashSize}px`;
        slashWrap.style.height = `${slashSize}px`;
        slashWrap.style.left = `${hitX}px`;
        slashWrap.style.top = `${hitY}px`;
        slashWrap.style.transform = `translate(-50%, -50%) rotate(${randomRot}deg) scaleX(${flipX})`;

        const slashImg = document.createElement('img');
        slashImg.src = `slash${slashType}_strip.png`;
        slashImg.className = `eye-slash-strip strip-${frameCount}`;
        slashImg.alt = 'eye slash';

        slashWrap.appendChild(slashImg);
        document.body.appendChild(slashWrap);

        // Impact, star bounce, and star chunk explosion at the exact hit coordinates
        setTimeout(() => {
          triggerStarBounce();
          spawnStarChunks(hitX, hitY);
        }, 85);

        // Remove from DOM when animation completes
        setTimeout(() => {
          if (slashWrap.parentNode) slashWrap.parentNode.removeChild(slashWrap);
        }, animDuration + 40);
      }

      function startEyeLoop() {
        if (eyeInterval) clearInterval(eyeInterval);
        if (eyeCount <= 0 || isPaused) return;
        eyeInterval = setInterval(() => {
          if (isPaused) return;
          for (let i = 0; i < eyeCount; i++) {
            setTimeout(() => {
              if (!isPaused) fireEyeSlash();
            }, (1000 / eyeCount) * i);
          }
        }, 1000);
      }

      buyLaserBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (starCurrency >= laserCurrentCost) {
          starCurrency -= laserCurrentCost;
          laserCount++;
          laserCurrentCost = Math.round(laserBaseCost * Math.pow(1.15, laserCount));
          startLaserLoop();
          updateClickerUI();
          saveGame();
        }
      });

      buyEyeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (starCurrency >= eyeCurrentCost) {
          starCurrency -= eyeCurrentCost;
          eyeCount++;
          eyeCurrentCost = Math.round(eyeBaseCost * Math.pow(1.15, eyeCount));
          startEyeLoop();
          updateClickerUI();
          saveGame();
        }
      });

      // Star crush squish reaction
      let lastCrushTime = 0;
      function triggerStarCrush() {
        const now = performance.now();
        if (now - lastCrushTime < 180) return;
        lastCrushTime = now;

        let currentScale = 1.0;
        if (totalClicksLifetime >= 50 && totalClicksLifetime < 100) {
          const progress = (totalClicksLifetime - 50) / 50;
          currentScale = 1.0 + (progress * 0.55);
        }
        popupImg.style.setProperty('--base-scale', currentScale);
        popupImg.style.setProperty('--base-rot', `${currentDeg}deg`);

        popupImg.classList.remove('crushed');
        void popupImg.offsetWidth; // force DOM reflow
        popupImg.classList.add('crushed');
        setTimeout(() => {
          popupImg.classList.remove('crushed');
        }, 380);
      }

      function spawnCrushShockwave(cx, cy) {
        if (document.hidden || isPaused) return;
        const wave = document.createElement('div');
        wave.className = 'crush-shockwave';
        wave.style.left = `${cx}px`;
        wave.style.top = `${cy}px`;
        document.body.appendChild(wave);
        setTimeout(() => {
          if (wave.parentNode) wave.parentNode.removeChild(wave);
        }, 360);
      }

      // --- HANDS CRUSH LOGIC (15000 clicks, +160 clicks per crush) ---
      function fireHandsCrush() {
        if (!popup.classList.contains('show') || isPaused) return;

        const popupRect = popupImg.getBoundingClientRect();
        const starCenterX = popupRect.left + popupRect.width / 2;
        const starCenterY = popupRect.top + popupRect.height / 2;

        starCurrency += 160;
        totalClicksLifetime += 160;
        updateClickerUI();

        if (document.hidden) return;

        const handsContainer = document.createElement('div');
        handsContainer.className = 'pixel-hands-container';
        handsContainer.style.left = `${starCenterX}px`;
        handsContainer.style.top = `${starCenterY}px`;

        const leftHand = document.createElement('img');
        leftHand.src = 'CLICKER.cur';
        leftHand.className = 'pixel-hand pixel-hand-left';
        leftHand.alt = 'crushing hand';

        const rightHand = document.createElement('img');
        rightHand.src = 'CLICKER.cur';
        rightHand.className = 'pixel-hand pixel-hand-right';
        rightHand.alt = 'crushing hand';

        handsContainer.appendChild(leftHand);
        handsContainer.appendChild(rightHand);
        document.body.appendChild(handsContainer);

        // Impact & crush happens at ~380ms
        setTimeout(() => {
          triggerStarCrush();
          spawnCrushShockwave(starCenterX, starCenterY);
          spawnStarChunks(starCenterX, starCenterY);
        }, 380);

        // Remove from DOM when animation completes
        setTimeout(() => {
          if (handsContainer.parentNode) handsContainer.parentNode.removeChild(handsContainer);
        }, 900);
      }

      function startHandsLoop() {
        if (handsInterval) clearInterval(handsInterval);
        if (handsCount <= 0 || isPaused) return;
        handsInterval = setInterval(() => {
          if (isPaused) return;
          for (let i = 0; i < handsCount; i++) {
            setTimeout(() => {
              if (!isPaused) fireHandsCrush();
            }, (1000 / handsCount) * i);
          }
        }, 1000);
      }

      buyHandsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (starCurrency >= handsCurrentCost) {
          starCurrency -= handsCurrentCost;
          handsCount++;
          handsCurrentCost = Math.round(handsBaseCost * Math.pow(1.15, handsCount));
          startHandsLoop();
          updateClickerUI();
          saveGame();
        }
      });

      // Save state on tab leave or close
      window.addEventListener('beforeunload', saveGame);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveGame();
      });

      // Load cached game progress from browser memory on initialization
      loadGame();
      updateClickerUI();
    })();
  </script>
</body>
</html>
