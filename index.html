<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="slash1_strip.png" as="image" />
  <link rel="preload" href="slash2_strip.png" as="image" />
  <link rel="preload" href="slash3_strip.png" as="image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; text-transform: lowercase; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("bg.jpg") center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%),
        rgba(0,0,0,0.18);
    }
    .word {
      position: relative;
      z-index: 1;
      display: block;
      width: clamp(200px, 42vw, 430px);
      height: auto;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.7));
    }
    /* the link + zoom live on the SVG anchor, so both react only to the letters */
    .word a {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    .word a:hover { transform: scale(1.06); }
    .word text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 150px;
      letter-spacing: 3px;
    }
    html {
      scroll-behavior: smooth;
    }
    .message-section {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      min-height: 52vh;
      min-height: 52dvh;
      padding: 1.5rem 1.5rem clamp(2rem, 5vh, 3.5rem) 1.5rem;
      text-align: center;
    }
    .message-text {
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 54px);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Star popup: fixed spawn position inside message-section */
    .popup-overlay {
      position: absolute;
      top: clamp(20px, 2.5vh, 36px);
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: clamp(140px, 35vw, 240px);
      height: clamp(140px, 35vw, 240px);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .popup-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      cursor: pointer;
    }
    .popup-overlay.fade-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.15);
      transition: opacity 1.2s ease-in, transform 1.2s ease-in;
      pointer-events: none;
    }
    .popup-overlay img#popupImg {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.6));
    }
    /* Red vignette overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(180, 0, 0, 0.75) 100%);
      transition: opacity 1.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Mini shining stars container */
    .mini-stars-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9995;
      overflow: hidden;
    }
    .mini-star {
      position: absolute;
      width: var(--size, 26px);
      height: var(--size, 26px);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: twinkleAndFloat var(--duration, 2.4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      filter: brightness(0.6) sepia(1) hue-rotate(320deg) saturate(9) drop-shadow(0 0 6px rgba(160, 0, 0, 0.9));
    }
    @keyframes twinkleAndFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      35% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.05) rotate(var(--rot, 20deg));
      }
      65% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.65) rotate(calc(var(--rot, 20deg) * -1));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(calc(var(--rot, 20deg) * 2));
      }
    }
    /* Clicker UI in bottom right */
    .clicker-hud {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.8rem;
      max-height: calc(100vh - 3rem);
      max-height: calc(100dvh - 3rem);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 40, 40, 0.4) transparent;
      padding-right: 4px;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .clicker-hud::-webkit-scrollbar {
      width: 4px;
    }
    .clicker-hud::-webkit-scrollbar-thumb {
      background: rgba(255, 40, 40, 0.4);
      border-radius: 4px;
    }
    .clicker-hud.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .clicker-counter {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 0, 0, 0.82);
      border: 1.5px solid rgba(255, 40, 40, 0.55);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .clicker-mouse-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 0 7px rgba(255, 0, 0, 0.9));
    }
    .clicker-count-text {
      font-size: 38px;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 50, 50, 0.9);
      line-height: 1;
    }
    .clicker-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .clicker-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .clicker-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    /* Upgrade row and visibility eye toggle button */
    .upgrade-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .upgrade-eye-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .upgrade-eye-btn:hover {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.06);
      box-shadow: 0 0 16px rgba(255, 0, 0, 0.6);
    }
    .upgrade-eye-btn.is-hidden {
      background: rgba(20, 0, 0, 0.7);
      border-color: rgba(255, 60, 60, 0.35);
      opacity: 0.7;
    }
    .upgrade-eye-btn.is-hidden:hover {
      opacity: 1;
      border-color: #ff3333;
    }
    .pixel-eye-svg {
      width: 22px;
      height: 22px;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(255, 30, 40, 0.85));
    }
    .upgrade-eye-btn .eye-open { display: block; }
    .upgrade-eye-btn .eye-closed { display: none; }
    .upgrade-eye-btn.is-hidden .eye-open { display: none; }
    .upgrade-eye-btn.is-hidden .eye-closed { display: block; }
    .clicker-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    /* Total CPS HUD in bottom left */
    .total-cps-hud {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(15, 0, 0, 0.82);
      border: 1.5px solid rgba(255, 40, 40, 0.55);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .total-cps-hud.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .total-cps-text {
      font-size: 28px;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 50, 50, 0.9);
      line-height: 1;
    }
    /* Animated auto-clicking mouse cursor (attached relative to the popup star) */
    .flying-clicker-mouse {
      position: absolute;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 10000;
      filter: none;
      animation: flyAndClick 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flyAndClick {
      0% {
        opacity: 0;
        transform: translate(-50px, 25px) rotate(-25deg) scale(0.8);
      }
      35% {
        opacity: 0.95;
        transform: translate(-18px, 9px) rotate(-12deg) scale(1);
      }
      65% {
        /* Press clicking right on the inner left edge of the star */
        opacity: 1;
        transform: translate(0px, 0px) rotate(0deg) scale(0.9);
      }
      80% {
        opacity: 0.8;
        transform: translate(-3px, -3px) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-10px, -8px) rotate(8deg) scale(0.7);
      }
    }
    /* Lasgun firing muzzle flash */
    .lasgun-muzzle-flash {
      position: fixed;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 20%, #ff1133 60%, transparent 100%);
      transform: translate(-50%, -50%);
      z-index: 10002;
      pointer-events: none;
      box-shadow: 0 0 20px 8px rgba(255, 0, 50, 0.9);
      animation: muzzleAnim 0.12s ease-out forwards;
    }
    @keyframes muzzleAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    }
    /* Lasgun high-energy beam tracer */
    .lasgun-tracer {
      position: fixed;
      top: 0;
      left: 0;
      width: 4px;
      background: linear-gradient(to top, rgba(255, 0, 50, 0) 0%, #ff2244 25%, #ffffff 85%, #ffffff 100%);
      border-radius: 3px;
      z-index: 10001;
      pointer-events: none;
      transform-origin: top center;
      box-shadow:
        0 0 6px 2px #ffffff,
        0 0 16px 5px #ff0033,
        0 0 28px 8px rgba(255, 0, 0, 0.7);
      animation: lasgunFlash 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes lasgunFlash {
      0% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(0.1);
      }
      25% {
        opacity: 1;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
      65% {
        opacity: 0.9;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) rotate(var(--angle)) scaleY(1);
      }
    }
    /* Lasgun impact flash on star */
    .laser-impact-flash {
      position: fixed;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 25%, #ff1133 60%, rgba(255, 0, 0, 0) 100%);
      transform: translate(-50%, -50%) scale(0.4);
      z-index: 10003;
      pointer-events: none;
      box-shadow: 0 0 30px 12px rgba(255, 20, 20, 0.95);
      animation: impactFlashAnim 0.24s ease-out forwards;
    }
    @keyframes impactFlashAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.6); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); }
    }
    /* Star chunks that fly off on laser hit */
    .star-chunk {
      position: fixed;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 10002;
      filter: brightness(1.2) sepia(1) hue-rotate(320deg) saturate(9) drop-shadow(0 0 8px rgba(255, 30, 30, 0.95));
    }
    @keyframes chunkFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      60% {
        opacity: 0.9;
        transform: translate(var(--cx), var(--cy)) rotate(var(--cr)) scale(0.85);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--cx) * 1.3), calc(var(--cy) + 90px)) rotate(calc(var(--cr) * 1.5)) scale(0.2);
      }
    }
    /* Laser buy button style */
    .laser-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .laser-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .laser-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .laser-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    .i-dot {
      cursor: pointer;
      display: inline-block;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .i-dot:hover {
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
    }
    /* Star bounce animation on hit/click */
    @keyframes starBounceAnim {
      0% { transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg)); }
      35% { transform: scale(calc(var(--base-scale, 1) * 0.88)) rotate(var(--base-rot, 0deg)); }
      70% { transform: scale(calc(var(--base-scale, 1) * 1.08)) rotate(var(--base-rot, 0deg)); }
      100% { transform: scale(var(--base-scale, 1)) rotate(var(--base-rot, 0deg)); }
    }
    .popup-overlay img#popupImg.bouncing {
      animation: starBounceAnim 0.18s ease-out forwards;
    }
    /* Eye Slash Sprite Animation (RED SLASH 1, 2, 3) */
    .eye-slash-wrap {
      position: fixed;
      z-index: 10005;
      pointer-events: none;
      transform-origin: center center;
      overflow: hidden;
      filter: drop-shadow(0 0 16px rgba(255, 0, 30, 0.95)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.7));
    }
    .eye-slash-strip {
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      display: block;
      pointer-events: none;
    }
    .strip-9 {
      width: 900%;
      max-width: none;
      animation: playSlashStrip9 0.28s steps(9) forwards;
    }
    .strip-7 {
      width: 700%;
      max-width: none;
      animation: playSlashStrip7 0.24s steps(7) forwards;
    }
    @keyframes playSlashStrip9 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    @keyframes playSlashStrip7 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .eye-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;

    }
    .eye-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .eye-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .eye-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    /* Hands Upgrade - Pixelated Hands Animation & Styles */
    .hands-buy-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(35, 0, 0, 0.9);
      border: 1.5px solid rgba(255, 60, 60, 0.6);
      color: #ffe6e6;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .hands-buy-btn:hover:not(:disabled) {
      background: rgba(95, 0, 0, 0.98);
      border-color: #ff3333;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .hands-buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
      color: #888;
    }
    .hands-cps-text {
      font-size: 24px;
      color: rgba(255, 170, 170, 0.85);
      letter-spacing: 1px;
      margin-top: -0.2rem;
    }
    .pixel-hands-container {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 0;
      height: 0;
      top: 0;
      left: 0;
    }
    .pixel-hand {
      position: absolute;
      top: 0;
      left: 0;
      width: 84px;
      height: 103px;
      margin-left: -42px;
      margin-top: -51px;
      pointer-events: none;
      image-rendering: pixelated;
      transform-origin: center center;
    }
    .pixel-hand-left {
      animation: handLeftCrush 0.88s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .pixel-hand-right {
      animation: handRightCrush 0.88s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    /* left hand = the cursor mirrored, pointing up */
    @keyframes handLeftCrush {
      0% {
        opacity: 0;
        transform: translate(-150px, 10px) scaleX(-1) scale(0.4);
        filter: blur(3px) brightness(0.4);

        <svg class="pixel-eye-svg eye-closed" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ff2a3d" d="M1 7h1v1h-1z M14 7h1v1h-1z M2 7h1v1h-1z M13 7h1v1h-1z M3 8h1v1h-1z M12 8h1v1h-1z M4 8h1v1h-1z M11 8h1v1h-1z M5 9h1v1h-1z M6 9h1v1h-1z M7 9h1v1h-1z M8 9h1v1h-1z M9 9h1v1h-1z M10 9h1v1h-1z M4 10h1v1h-1z M11 10h1v1h-1z M6 11h1v1h-1z M9 11h1v1h-1z"/></svg>

        <svg class="pixel-eye-svg eye-closed" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ff2a3d" d="M1 7h1v1h-1z M14 7h1v1h-1z M2 7h1v1h-1z M13 7h1v1h-1z M3 8h1v1h-1z M12 8h1v1h-1z M4 8h1v1h-1z M11 8h1v1h-1z M5 9h1v1h-1z M6 9h1v1h-1z M7 9h1v1h-1z M8 9h1v1h-1z M9 9h1v1h-1z M10 9h1v1h-1z M4 10h1v1h-1z M11 10h1v1h-1z M6 11h1v1h-1z M9 11h1v1h-1z"/></svg>

      <button class="upgrade-eye-btn" id="toggleEclipseBtn" aria-label="Hide eclipse" title="Hide/show eclipse animations">
        <svg class="pixel-eye-svg eye-open" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ff2a3d" d="M5 4h1v1h-1z M6 4h1v1h-1z M7 4h1v1h-1z M8 4h1v1h-1z M9 4h1v1h-1z M10 4h1v1h-1z M3 5h1v1h-1z M4 5h1v1h-1z M11 5h1v1h-1z M12 5h1v1h-1z M2 6h1v1h-1z M13 6h1v1h-1z M1 7h1v1h-1z M14 7h1v1h-1z M7 6h1v1h-1z M8 6h1v1h-1z M6 7h1v1h-1z M9 7h1v1h-1z M7 8h1v1h-1z M8 8h1v1h-1z M2 8h1v1h-1z M13 8h1v1h-1z M3 9h1v1h-1z M4 9h1v1h-1z M11 9h1v1h-1z M12 9h1v1h-1z M5 10h1v1h-1z M6 10h1v1h-1z M7 10h1v1h-1z M8 10h1v1h-1z M9 10h1v1h-1z M10 10h1v1h-1z"/></svg>
        <svg class="pixel-eye-svg eye-closed" viewBox="0 0 16 16" shape-rendering="crispEdges"><path fill="#ff2a3d" d="M1 7h1v1h-1z M14 7h1v1h-1z M2 7h1v1h-1z M13 7h1v1h-1z M3 8h1v1h-1z M12 8h1v1h-1z M4 8h1v1h-1z M11 8h1v1h-1z M5 9h1v1h-1z M6 9h1v1h-1z M7 9h1v1h-1z M8 9h1v1h-1z M9 9h1v1h-1z M10 9h1v1h-1z M4 10h1v1h-1z M11 10h1v1h-1z M6 11h1v1h-1z M9 11h1v1h-1z"/></svg>
      </button>
      <button class="eclipse-buy-btn" id="buyEclipseBtn">
        <span>+1 eclipse (<span id="eclipseCost">450000</span>)</span>
      </button>

    <div class="eclipse-cps-text" id="eclipseDisplay" style="display:none;">0 eclipses (0/s)</div>
  </div>

  <!-- Total CPS HUD in bottom left -->
  <div class="total-cps-hud" id="totalCpsHud" aria-hidden="true">
    <span class="total-cps-text" id="totalCpsDisplay">total: 0 clicks/s</span>
  </div>

  <!-- Reset Confirmation Modal -->
  <div class="reset-modal-overlay" id="resetModal" aria-hidden="true">
    <div class="reset-modal-box">
      <h2 class="reset-modal-title">reset progress?</h2>
      <p class="reset-modal-desc">this will clear your clicks, upgrades, and stats completely.</p>
      <div class="reset-modal-actions">
        <button class="reset-confirm-btn" id="confirmResetBtn">yes, reset</button>
        <button class="reset-cancel-btn" id="cancelResetBtn">cancel</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const text = document.getElementById('loveText');
      const popup = document.getElementById('faviconPopup');
      const popupImg = document.getElementById('popupImg');
      const vignette = document.getElementById('vignetteOverlay');
      const starsContainer = document.getElementById('miniStarsContainer');

      const clickerHud = document.getElementById('clickerHud');
      const countDisplay = document.getElementById('starCountDisplay');
      const buyBtn = document.getElementById('buyClickerBtn');
      const costDisplay = document.getElementById('autoClickerCost');
      const cpsDisplay = document.getElementById('cpsDisplay');

      // Total CPS refs
      const totalCpsHud = document.getElementById('totalCpsHud');
      const totalCpsDisplay = document.getElementById('totalCpsDisplay');

      // Laser refs
      const buyLaserBtn = document.getElementById('buyLaserBtn');
      const laserCostDisplay = document.getElementById('laserCost');
      const laserDisplay = document.getElementById('laserDisplay');

      // Eye refs
      const buyEyeBtn = document.getElementById('buyEyeBtn');
      const eyeCostDisplay = document.getElementById('eyeCost');
      const eyeDisplay = document.getElementById('eyeDisplay');

      // Hands refs
      const buyHandsBtn = document.getElementById('buyHandsBtn');
      const handsCostDisplay = document.getElementById('handsCost');
      const handsDisplay = document.getElementById('handsDisplay');

      // Meteor refs
      const buyMeteorBtn = document.getElementById('buyMeteorBtn');
      const meteorCostDisplay = document.getElementById('meteorCost');
      const meteorDisplay = document.getElementById('meteorDisplay');

      // Eclipse refs
      const buyEclipseBtn = document.getElementById('buyEclipseBtn');
      const eclipseCostDisplay = document.getElementById('eclipseCost');
      const eclipseDisplay = document.getElementById('eclipseDisplay');

      // Upgrade rows for unlock visibility
      const mouseRow = document.getElementById('mouseRow');
      const laserRow = document.getElementById('laserRow');
      const eyeRow = document.getElementById('eyeRow');
      const handsRow = document.getElementById('handsRow');
      const meteorRow = document.getElementById('meteorRow');
      const eclipseRow = document.getElementById('eclipseRow');

      // Upgrade visual visibility state (default: all visible)
      const upgradeVis = {
        mouse: true,
        laser: true,
        eye: true,
        hands: true,
        meteor: true,
        eclipse: true
      };

      const eyeToggleBtns = {
        mouse: document.getElementById('toggleMouseBtn'),
        laser: document.getElementById('toggleLaserBtn'),
        eye: document.getElementById('toggleEyeBtn'),
        hands: document.getElementById('toggleHandsBtn'),
        meteor: document.getElementById('toggleMeteorBtn'),
        eclipse: document.getElementById('toggleEclipseBtn')
      };

      function updateEyeToggleBtns() {
        for (const key in eyeToggleBtns) {
          const btn = eyeToggleBtns[key];
          if (!btn) continue;
          if (upgradeVis[key]) {
            btn.classList.remove('is-hidden');
            btn.setAttribute('aria-label', `Hide ${key}`);
          } else {
            btn.classList.add('is-hidden');
            btn.setAttribute('aria-label', `Show ${key}`);
          }
        }
      }

      function setupEyeToggle(key) {
        const btn = eyeToggleBtns[key];
        if (!btn) return;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          upgradeVis[key] = !upgradeVis[key];
          updateEyeToggleBtns();
          saveGame();
        });
      }

      for (const k in eyeToggleBtns) setupEyeToggle(k);

      // Reset modal refs & i-dot
      const iDot = document.getElementById('iDot');
      const resetModal = document.getElementById('resetModal');
      const confirmResetBtn = document.getElementById('confirmResetBtn');
      const cancelResetBtn = document.getElementById('cancelResetBtn');
      let iDotClicks = 0;
      let iDotTimer = null;
      let isPaused = false;
      let isResetting = false;

      let count = 0;
      let hideTimeout = null;
      let spreeDecayTimer = null;
      let isRotated = false;
      let spamClicks = 0;
      let lastClickTime = 0;

      let starCurrency = 0;
      let totalClicksLifetime = 0;
      let currentDeg = 0;

      // Balance curves (Cookie Clicker standard: ~1.15x cost multiplier per tier)
      // Tier 1: Mouse cursor (+1 click/s) - Base cost 100
      let autoClickers = 0;
      let autoClickerBaseCost = 100;
      let autoClickerCost = 100;
      let autoClickInterval = null;

      // Tier 2: Lasgun beam (+10 clicks/s) - Base cost 1000, unlocks at 750
      let laserCount = 0;
      let laserBaseCost = 1000;
      let laserCurrentCost = 1000;
      let laserInterval = null;

      // Tier 3: Eye sword slash (+50 clicks/s) - Base cost 5500, unlocks at 4000
      let eyeCount = 0;
      let eyeBaseCost = 5500;
      let eyeCurrentCost = 5500;
      let eyeInterval = null;

      // Tier 4: Hands crush (+200 clicks/s) - Base cost 26000, unlocks at 18000
      let handsCount = 0;
      let handsBaseCost = 26000;
      let handsCurrentCost = 26000;
      let handsInterval = null;

      // Tier 5: Meteor strike (+750 clicks/s) - Base cost 110000, unlocks at 75000
      let meteorCount = 0;
      let meteorBaseCost = 110000;
      let meteorCurrentCost = 110000;
      let meteorInterval = null;

      // Tier 6: Eclipse occultation (+2500 clicks/s) - Base cost 450000, unlocks at 280000
      let eclipseCount = 0;
      let eclipseBaseCost = 450000;
      let eclipseCurrentCost = 450000;
      let eclipseInterval = null;

      const messageSection = document.querySelector('.message-section');

      // Star bounce animation trigger (throttled to avoid layout thrashing)
      let lastBounceTime = 0;
      function triggerStarBounce() {
        const now = performance.now();
        if (now - lastBounceTime < 90) return;
        lastBounceTime = now;

        let currentScale = 1.0;
        if (totalClicksLifetime >= 50 && totalClicksLifetime < 100) {
          const progress = (totalClicksLifetime - 50) / 50;
          currentScale = 1.0 + (progress * 0.55);
        }
        popupImg.style.setProperty('--base-scale', currentScale);
        popupImg.style.setProperty('--base-rot', `${currentDeg}deg`);

        popupImg.classList.remove('bouncing');
        void popupImg.offsetWidth; // force DOM reflow
        popupImg.classList.add('bouncing');
      }

      // Local storage persistence
      const SAVE_KEY = 'zeras_clicker_save';
      let saveTimeout = null;

      function saveGame() {
        if (isResetting || isPaused) return;
        try {
          const data = {
            starCurrency,
            totalClicksLifetime,
            autoClickers,
            laserCount,
            eyeCount,
            handsCount,
            meteorCount,
            eclipseCount,
            upgradeVis
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        } catch (err) {}
      }

      function queueSave() {
        if (isResetting || isPaused) return;
        if (saveTimeout) return;
        saveTimeout = setTimeout(() => {
          saveTimeout = null;
          saveGame();
        }, 800);
      }

      function loadGame() {
        try {
          const saved = localStorage.getItem(SAVE_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (typeof data.starCurrency === 'number') starCurrency = Math.max(0, data.starCurrency);
            if (typeof data.totalClicksLifetime === 'number') totalClicksLifetime = Math.max(0, data.totalClicksLifetime);
            if (typeof data.autoClickers === 'number') autoClickers = Math.max(0, data.autoClickers);
            if (typeof data.laserCount === 'number') laserCount = Math.max(0, data.laserCount);
            if (typeof data.eyeCount === 'number') eyeCount = Math.max(0, data.eyeCount);
            if (typeof data.handsCount === 'number') handsCount = Math.max(0, data.handsCount);
            if (typeof data.meteorCount === 'number') meteorCount = Math.max(0, data.meteorCount);
            if (typeof data.eclipseCount === 'number') eclipseCount = Math.max(0, data.eclipseCount);

            if (data.upgradeVis && typeof data.upgradeVis === 'object') {
              for (const k of ['mouse', 'laser', 'eye', 'hands', 'meteor', 'eclipse']) {
                if (typeof data.upgradeVis[k] === 'boolean') upgradeVis[k] = data.upgradeVis[k];
              }
            }
            updateEyeToggleBtns();

            autoClickerCost = Math.round(autoClickerBaseCost * Math.pow(1.15, autoClickers));
            laserCurrentCost = Math.round(laserBaseCost * Math.pow(1.15, laserCount));
            eyeCurrentCost = Math.round(eyeBaseCost * Math.pow(1.15, eyeCount));
            handsCurrentCost = Math.round(handsBaseCost * Math.pow(1.15, handsCount));
            meteorCurrentCost = Math.round(meteorBaseCost * Math.pow(1.15, meteorCount));
            eclipseCurrentCost = Math.round(eclipseBaseCost * Math.pow(1.15, eclipseCount));

            if (autoClickers > 0) startAutoClickerLoop();
            if (laserCount > 0) startLaserLoop();
            if (eyeCount > 0) startEyeLoop();
            if (handsCount > 0) startHandsLoop();
            if (meteorCount > 0) startMeteorLoop();
            if (eclipseCount > 0) startEclipseLoop();

            if (totalClicksLifetime >= 100) {
              popup.classList.remove('fade-out');
              popup.classList.add('show');
            }
          }
        } catch (err) {}
      }

      // Reset modal handling
      function openResetModal() {
        isPaused = true;
        if (autoClickInterval) { clearInterval(autoClickInterval); autoClickInterval = null; }
        if (laserInterval) { clearInterval(laserInterval); laserInterval = null; }
        if (eyeInterval) { clearInterval(eyeInterval); eyeInterval = null; }
        if (handsInterval) { clearInterval(handsInterval); handsInterval = null; }
        if (meteorInterval) { clearInterval(meteorInterval); meteorInterval = null; }
        if (eclipseInterval) { clearInterval(eclipseInterval); eclipseInterval = null; }
        resetModal.classList.add('open');
        resetModal.removeAttribute('aria-hidden');
      }

      function closeResetModal() {
        isPaused = false;
        if (autoClickers > 0) startAutoClickerLoop();
        if (laserCount > 0) startLaserLoop();
        if (eyeCount > 0) startEyeLoop();
        if (handsCount > 0) startHandsLoop();
        if (meteorCount > 0) startMeteorLoop();
        if (eclipseCount > 0) startEclipseLoop();
        resetModal.classList.remove('open');
        resetModal.setAttribute('aria-hidden', 'true');
      }

      confirmResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isResetting = true;
        isPaused = true;
        if (autoClickInterval) { clearInterval(autoClickInterval); autoClickInterval = null; }
        if (laserInterval) { clearInterval(laserInterval); laserInterval = null; }
        if (eyeInterval) { clearInterval(eyeInterval); eyeInterval = null; }
        if (handsInterval) { clearInterval(handsInterval); handsInterval = null; }
        if (meteorInterval) { clearInterval(meteorInterval); meteorInterval = null; }
        if (eclipseInterval) { clearInterval(eclipseInterval); eclipseInterval = null; }
        if (hideTimeout) clearTimeout(hideTimeout);
        if (spreeDecayTimer) clearTimeout(spreeDecayTimer);
        if (saveTimeout) clearTimeout(saveTimeout);
        starCurrency = 0;
        totalClicksLifetime = 0;
        autoClickers = 0;
        laserCount = 0;
        eyeCount = 0;
        handsCount = 0;
        meteorCount = 0;
        eclipseCount = 0;
        for (const k in upgradeVis) upgradeVis[k] = true;
        updateEyeToggleBtns();
        try {
          localStorage.removeItem(SAVE_KEY);
          localStorage.clear();
        } catch (err) {}
        location.reload();
      });

      cancelResetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeResetModal();
      });
      // Pop-up is only dismissed by clicking cancel or yes reset (clicking outside does nothing)

      // Triple click on i-dot to trigger reset confirmation
      iDot.addEventListener('click', (e) => {
        e.stopPropagation();
        iDotClicks++;
        clearTimeout(iDotTimer);
        if (iDotClicks >= 3) {
          iDotClicks = 0;
          openResetModal();
        } else {
          iDotTimer = setTimeout(() => {
            iDotClicks = 0;
          }, 600);
        }
      });

      function updateClickerUI() {
        countDisplay.textContent = Math.floor(starCurrency);
        costDisplay.textContent = autoClickerCost;
        cpsDisplay.textContent = `${autoClickers} mouse clickers (${autoClickers}/s)`;
        buyBtn.disabled = starCurrency < autoClickerCost;

        // Total CPS count for bottom left HUD
        const totalCps = (autoClickers * 1) + (laserCount * 10) + (eyeCount * 50) + (handsCount * 200) + (meteorCount * 750) + (eclipseCount * 2500);
        totalCpsDisplay.textContent = `total: ${totalCps} clicks/s`;

        // Clicker HUD game unlocks at 100 clicks
        if (totalClicksLifetime >= 100) {
          clickerHud.classList.add('active');
          clickerHud.removeAttribute('aria-hidden');
          totalCpsHud.classList.add('active');
          totalCpsHud.removeAttribute('aria-hidden');
        }

        // Show laser row once player hits 750 lifetime clicks
        if (totalClicksLifetime >= 750) {
          laserRow.style.display = 'flex';
          laserDisplay.style.display = '';
        }
        laserCostDisplay.textContent = laserCurrentCost;
        laserDisplay.textContent = `${laserCount} lasers (${laserCount * 10}/s)`;
        buyLaserBtn.disabled = starCurrency < laserCurrentCost;

        // Show eye row once player hits 4000 lifetime clicks
        if (totalClicksLifetime >= 4000) {
          eyeRow.style.display = 'flex';
          eyeDisplay.style.display = '';
        }
        eyeCostDisplay.textContent = eyeCurrentCost;
        eyeDisplay.textContent = `${eyeCount} eyes (${eyeCount * 50}/s)`;
        buyEyeBtn.disabled = starCurrency < eyeCurrentCost;

        // Show hands row once player hits 18000 lifetime clicks
        if (totalClicksLifetime >= 18000) {
          handsRow.style.display = 'flex';
          handsDisplay.style.display = '';
        }
        handsCostDisplay.textContent = handsCurrentCost;
        handsDisplay.textContent = `${handsCount} hands (${handsCount * 200}/s)`;
        buyHandsBtn.disabled = starCurrency < handsCurrentCost;

        // Show meteor row once player hits 75000 lifetime clicks
        if (totalClicksLifetime >= 75000) {
          meteorRow.style.display = 'flex';
          meteorDisplay.style.display = '';
        }
        meteorCostDisplay.textContent = meteorCurrentCost;
        meteorDisplay.textContent = `${meteorCount} meteors (${meteorCount * 750}/s)`;
        buyMeteorBtn.disabled = starCurrency < meteorCurrentCost;

        // Show eclipse row once player hits 280000 lifetime clicks
        if (totalClicksLifetime >= 280000) {
          eclipseRow.style.display = 'flex';
          eclipseDisplay.style.display = '';
        }
        eclipseCostDisplay.textContent = eclipseCurrentCost;
        eclipseDisplay.textContent = `${eclipseCount} eclipses (${eclipseCount * 2500}/s)`;
        buyEclipseBtn.disabled = starCurrency < eclipseCurrentCost;

        queueSave();
      }

      function clearStars() {
        starsContainer.innerHTML = '';
        vignette.style.opacity = '0';
        spamClicks = 0;
      }

      function scheduleFadeOut() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {

          if (totalClicksLifetime >= 50 && totalClicksLifetime < 100) {
            const progress = (totalClicksLifetime - 50) / 50;
            currentScale = 1.0 + (progress * 0.55);

          // Spin speed & smoothness logic:
          let spinSpeed = 0.35;
          let easing = 'cubic-bezier(0.34, 1.56, 0.64, 1)';

          if (totalClicksLifetime >= 100) {
            const spreeFactor = Math.min(spamClicks / 10, 1);
            spinSpeed = 0.65 - (spreeFactor * 0.50);
            easing = 'cubic-bezier(0.25, 1, 0.5, 1)';
          } else if (totalClicksLifetime >= 50) {
            const progress = (totalClicksLifetime - 50) / 50;
            spinSpeed = 0.35 - (progress * 0.23);

          popupImg.style.transition = `transform ${spinSpeed.toFixed(3)}s ${easing}`;

            const sparkCount = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < sparkCount; i++) {
              const spark = document.createElement('div');
              spark.className = 'eclipse-spark';
              spark.style.left = `${cx}px`;
              spark.style.top = `${cy}px`;

              const ang = Math.random() * Math.PI * 2;
              const sdist = 60 + Math.random() * 140;
              const sx = Math.cos(ang) * sdist;
              const sy = Math.sin(ang) * sdist;
              const sdur = 0.45 + Math.random() * 0.25;

              spark.style.setProperty('--sx', `${sx}px`);
              spark.style.setProperty('--sy', `${sy}px`);
              spark.style.setProperty('--spark-dur', `${sdur.toFixed(2)}s`);

              document.body.appendChild(spark);
              setTimeout(() => {
                if (spark.parentNode) spark.parentNode.removeChild(spark);
              }, (sdur + 0.1) * 1000);
            }
          }
        }, 220);

        // Remove manifestation when animation ends
        setTimeout(() => {
          if (manifestation.parentNode) manifestation.parentNode.removeChild(manifestation);
        }, 750);
      }

      function fireEclipse() {
        if (!popup.classList.contains('show') || isPaused) return;

        const popupRect = popupImg.getBoundingClientRect();
        const starCenterX = popupRect.left + popupRect.width / 2;
        const starCenterY = popupRect.top + popupRect.height / 2;

        starCurrency += 2500;
        totalClicksLifetime += 2500;
        updateClickerUI();

        if (document.hidden || !upgradeVis.eclipse) return;
        if (document.querySelectorAll('.eclipse-manifestation').length >= 2) return;

        spawnEclipseVisuals(starCenterX, starCenterY, popupRect.width);
      }

      function startEclipseLoop() {
        if (eclipseInterval) clearInterval(eclipseInterval);
        if (eclipseCount <= 0 || isPaused) return;
        eclipseInterval = setInterval(() => {
          if (isPaused) return;
          for (let i = 0; i < eclipseCount; i++) {
            setTimeout(() => {
              if (!isPaused) fireEclipse();
            }, (1000 / eclipseCount) * i);
          }
        }, 1000);
      }

      buyEclipseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (starCurrency >= eclipseCurrentCost) {
          starCurrency -= eclipseCurrentCost;
          eclipseCount++;
          eclipseCurrentCost = Math.round(eclipseBaseCost * Math.pow(1.15, eclipseCount));
          startEclipseLoop();
          updateClickerUI();
          saveGame();
        }
      });

      // Save state on tab leave or close
      window.addEventListener('beforeunload', saveGame);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveGame();
      });

      // Load cached game progress from browser memory on initialization
      loadGame();
      updateClickerUI();
    })();
  </script>
</body>
</html>
