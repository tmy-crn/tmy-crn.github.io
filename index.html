<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>zeras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: #000 url("bg.jpg") center / cover no-repeat;
      z-index: 0;
    }
    /* subtle darkening + vignette so the red reads cleanly */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%),
        rgba(0,0,0,0.18);
    }
    .zeras {
      position: relative;
      z-index: 1;
      font-family: 'Jacquard 12', 'Times New Roman', serif;
      font-size: min(30vw, 48vh);
      line-height: 1;
      letter-spacing: 0.02em;
      text-decoration: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      background: url("red.jpg") center / cover;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;

      filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.7));
      transition: transform 0.18s ease, filter 0.18s ease;
    }
    .zeras:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 8px 30px rgba(190, 0, 0, 0.4));
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <a class="zeras" href="https://discord.gg/zJE2NZjqwx" aria-label="zeras — join the Discord">zeras</a>
</body>
</html>
