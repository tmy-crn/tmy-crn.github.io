<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>watch</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; text-transform: lowercase; }
    html, body { min-height: 100%; background: #000; color: #fff; font-family: ui-rounded, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 20px; text-align: center; }
    main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: center; gap: 12px; font-size: 12px; letter-spacing: 3px; color: #8e8e93; }
    #dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3a3c; align-self: center; }
    #dot.on { background: #30d158; }
    #hero { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; color: #8e8e93; }
    #rate { font-size: 84px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    #prog { width: 100%; height: 2px; background: #1c1c1e; border-radius: 1px; overflow: hidden; }
    #prog[hidden] { display: none; }
    #prog div { height: 100%; width: 0; background: #30d158; transition: width 0.12s linear; }
    #clock { font-size: 22px; font-variant-numeric: tabular-nums; color: #8e8e93; min-height: 26px; }
    #dur { display: flex; justify-content: space-between; align-items: center; background: #1c1c1e; border-radius: 16px; padding: 10px 16px; font-size: 15px; }
    #dur select { background: #2c2c2e; color: #fff; border: 0; border-radius: 8px; padding: 6px 8px; font-size: 15px; }
    #face { width: 100%; height: 240px; background: #0b0b0c; border-radius: 16px; }
    #guide svg { height: 150px; }
    #guide p { font-size: 12px; color: #636366; margin-top: 6px; }
    .glow { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    #stats { display: none; gap: 12px; }
    .card { flex: 1; background: #1c1c1e; border-radius: 16px; padding: 14px 4px; text-align: center; }
    .card small { display: block; font-size: 12px; color: #8e8e93; }
    .card b { display: block; font-size: 17px; margin: 4px 0; font-variant-numeric: tabular-nums; }
    .card i { display: block; font-style: normal; font-size: 11px; color: #636366; }
    button { border: 0; border-radius: 999px; padding: 16px; font-size: 17px; font-weight: 600; background: #30d158; color: #000; cursor: pointer; }
    button.stop { background: #ff453a; }
    #err { color: #ff453a; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<main>
  <header><span>watchmeter</span><span id="dot"></span></header>
  <div id="hero">
    <div id="guide"></div>
    <div id="msg">lay the watch dial up on the table, touching the microphone</div>
    <div id="rate" hidden></div>
    <div id="unit" hidden>seconds per day</div>
  </div>
  <canvas id="face"></canvas>
  <div id="prog" hidden><div></div></div>
  <div id="clock"></div>
  <div id="stats">
    <div class="card"><small>beat rate</small><b id="bph"></b><i id="hz"></i></div>
    <div class="card"><small>beat error</small><b id="be"></b><i id="bel"></i></div>
    <div class="card"><small>amplitude</small><b id="amp"></b><i id="ampn"></i></div>
  </div>
  <div id="err"></div>
  <label id="dur">capture time <select id="durSel"><option value="15">15 s</option><option value="30" selected>30 s</option><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option></select></label>
  <button id="go">start</button>
</main>
<script>
// est-start
const STD = [14400, 18000, 19800, 21600, 25200, 28800, 36000];

function read(ticks, lift, min = 20) {
  const t = ticks.map(k => k.time);
  if (t.length < min) return null;
  const spans = [];
  for (let i = 2; i < t.length; i++) spans.push((t[i] - t[i - 2]) / 2);
  spans.sort((a, b) => a - b);
  const iv = spans[spans.length >> 1];
  const ks = t.map(x => Math.round((x - t[0]) / iv));
  const n = t.length;
  const km = ks.reduce((a, b) => a + b, 0) / n, tm = t.reduce((a, b) => a + b, 0) / n;
  let cov = 0, v = 0;
  for (let i = 0; i < n; i++) { cov += (ks[i] - km) * (t[i] - tm); v += (ks[i] - km) ** 2; }
  if (v === 0) return null;
  const slope = cov / v, icpt = tm - slope * km;
  const e = { s: 0, c: 0 }, o = { s: 0, c: 0 };
  for (let i = 0; i < n; i++) {
    const r = t[i] - (icpt + slope * ks[i]);
    const b = ((ks[i] % 2) + 2) % 2 === 0 ? e : o;
    b.s += r; b.c++;
  }
  if (!e.c || !o.c) return null;
  const bph = STD.reduce((a, b) => Math.abs(b - 3600 / slope) < Math.abs(a - 3600 / slope) ? b : a);
  let amplitude = null;
  const gaps = ticks.map(k => k.gap).filter(g => g != null).sort((a, b) => a - b);
  if (gaps.length >= 10) {
    const a = lift / (2 * Math.sin(Math.PI * gaps[gaps.length >> 1] * bph / 3600));
    if (a >= 100 && a <= 360) amplitude = a;
  }
  const trace = t.map((x, i) => ({ even: ((ks[i] % 2) + 2) % 2 === 0, dev: x - (icpt + 3600 / bph * ks[i]), time: x }));
  return {
    trace,
    spd: (3600 / bph / slope - 1) * 86400,
    bph, amplitude,
    beatErrorMs: Math.abs(e.s / e.c - o.s / o.c) * 1000,
  };
}
// est-end

const workletSrc = `
class D extends AudioWorkletProcessor {
  constructor() {
    super();
    this.n = 0; this.last = 0; this.noise = 0.001; this.lastTick = -1e6;
    this.pending = false; this.onset = 0; this.peak = 0; this.best = 0; this.bestN = 0;
  }
  process(inputs) {
    const x = inputs[0][0];
    if (!x) return true;
    const rate = sampleRate, out = [];
    const refractory = 0.05 * rate, settle = 0.0015 * rate, window = 0.012 * rate;
    for (let i = 0; i < x.length; i++) {
      const d = Math.abs(x[i] - this.last);
      this.last = x[i];
      if (this.pending) {
        const age = this.n - this.onset;
        if (age < settle) this.peak = Math.max(this.peak, d);
        else if (d > this.best) { this.best = d; this.bestN = this.n; }
        if (age >= window) {
          out.push({ time: this.onset / rate, gap: this.best > 0.25 * this.peak ? (this.bestN - this.onset) / rate : null });
          this.pending = false;
        }
      } else if (d > Math.max(8 * this.noise, 0.003) && this.n - this.lastTick > refractory) {
        this.pending = true; this.onset = this.n; this.lastTick = this.n;
        this.peak = d; this.best = 0; this.bestN = this.n;
      }
      this.noise += 0.001 * (d - this.noise);
      this.n++;
    }
    if (out.length) this.port.postMessage(out);
    return true;
  }
}
registerProcessor('d', D);`;

function drawFace(r) {
  const c = $('face'), dpr = devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight, SPAN = 40, TOP = 54; // SPAN: ms across the face, wraps like paper
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const sx = v => W * (0.09 + 0.82 * (v + 30) / 60);
  g.font = '12px system-ui'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.lineWidth = 1;
  for (const v of [-30, -20, -10, 0, 10, 20, 30]) {
    g.strokeStyle = v === 0 ? '#3a3a3c' : '#2c2c2e';
    g.beginPath(); g.moveTo(sx(v), 28); g.lineTo(sx(v), H); g.stroke();
    g.fillStyle = v < 0 ? '#ff453a' : v > 0 ? '#30d158' : '#fff';
    g.fillText(v > 0 ? '+' + v : v < 0 ? '−' + -v : '0', sx(v), 14);
  }
  if (!r) return;
  if (r.trace.length >= 20) {
    const x = sx(Math.max(-30, Math.min(30, r.spd)));
    g.fillStyle = color(r.spd);
    g.beginPath(); g.moveTo(x, 30); g.lineTo(x - 6, 42); g.lineTo(x + 6, 42); g.fill();
  }
  for (const p of r.trace) {
    // a fast watch ticks early, so its dots drift right
    const w = (((p.dev * 1000 + SPAN / 2) % SPAN) + SPAN) % SPAN - SPAN / 2;
    g.fillStyle = p.even ? '#30d158' : '#8ee6a6';
    g.beginPath(); g.arc(W / 2 - w / SPAN * W, H - 6 - Math.min(p.time / runDur, 1) * (H - TOP - 6), 2.2, 0, 7); g.fill();
  }
}

const $ = id => document.getElementById(id);

// screen size and pixel ratio only narrow an iPhone down to a model group
const IPHONES = {
  '320x568@2': 'iphone 5s / se', '375x667@2': 'iphone 6 to 8 / se',
  '414x736@3': 'iphone plus', '375x812@3': 'iphone x / 11 pro / mini',
  '414x896@2': 'iphone xr / 11', '414x896@3': 'iphone xs max / 11 pro max',
  '390x844@3': 'iphone 12 to 14', '428x926@3': 'iphone 12 / 13 / 14 plus and pro max',
  '393x852@3': 'iphone 14 pro to 16', '430x932@3': 'iphone 14 pro max to 16 plus',
  '402x874@3': 'iphone 16 pro / 17', '440x956@3': 'iphone pro max',
};

async function detectPhone() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) {
    const w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
    return { name: IPHONES[w + 'x' + h + '@' + devicePixelRatio] || 'iphone', micX: 42 };
  }
  if (/Android/.test(ua)) {
    let model = '';
    try { model = (await navigator.userAgentData.getHighEntropyValues(['model'])).model; } catch {}
    return { name: model && model.length > 1 ? model : 'android phone', micX: 60 };
  }
  return null;
}

function showGuide(p) {
  $('guide').innerHTML = p
    ? '<svg viewBox="0 0 120 230"><defs><radialGradient id="gl"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#30d158" stop-opacity="0"/></radialGradient></defs>' +
      '<rect x="20" y="6" width="80" height="208" rx="18" fill="#0b0b0c" stroke="#636366" stroke-width="2"/>' +
      '<rect x="48" y="12" width="24" height="6" rx="3" fill="#2c2c2e"/>' +
      '<circle class="glow" cx="' + p.micX + '" cy="214" r="20" fill="url(#gl)"/>' +
      '<circle cx="' + p.micX + '" cy="214" r="3" fill="#30d158"/></svg>' +
      '<p>' + p.name + ': microphone is on the bottom edge, put the watch right there</p>'
    : '';
}
detectPhone().then(showGuide);
let ctx, stream, ticks = [], runDur = 30, startCtx = 0, timer = 0;


function color(spd) { const a = Math.abs(spd); return a < 6 ? '#30d158' : a < 15 ? '#ffd60a' : '#ff453a'; }

function render() {
  const r = read(ticks, 52, 6);
  const full = !!r && ticks.length >= 20;
  drawFace(r);
  $('rate').hidden = $('unit').hidden = !full;
  $('stats').style.display = full ? 'flex' : 'none';
  $('msg').hidden = full;
  $('guide').hidden = full;
  $('msg').textContent = ctx ? 'listening, detecting beat rate' : 'lay the watch dial up on the table, touching the microphone';
  if (!full) return;
  $('rate').textContent = (r.spd >= 0 ? '+' : '') + r.spd.toFixed(1);
  $('rate').style.color = color(r.spd);
  $('unit').textContent = r.spd >= 0 ? 'seconds gained per day' : 'seconds lost per day';
  $('bph').textContent = r.bph.toLocaleString() + ' bph';
  $('hz').textContent = r.bph / 3600 + ' hz, auto';
  $('be').textContent = r.beatErrorMs.toFixed(1) + ' ms';
  $('bel').textContent = r.beatErrorMs < 0.5 ? 'excellent' : r.beatErrorMs < 1.5 ? 'good' : 'high';
  $('amp').textContent = r.amplitude ? Math.round(r.amplitude) + '°' : '–';
  $('ampn').textContent = r.amplitude ? 'dial up' : 'no clear reading';
}

async function start() {
  $('err').textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    ctx = new AudioContext();
    const url = URL.createObjectURL(new Blob([workletSrc], { type: 'text/javascript' }));
    await ctx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(ctx, 'd');
    node.port.onmessage = e => {
      ticks.push(...e.data);
      render();
    };
    ctx.createMediaStreamSource(stream).connect(node);
    startCtx = ctx.currentTime;
  } catch (e) {
    $('err').textContent = 'microphone unavailable: ' + e.message;
    return stop();
  }
  ticks = [];
  runDur = +$('durSel').value;
  $('durSel').disabled = true;
  $('prog').hidden = false;
  timer = setInterval(tick, 100);
  tick();
  $('go').textContent = 'stop'; $('go').className = 'stop'; $('dot').className = 'on';
  render();
}

function tick() {
  const el = ctx.currentTime - startCtx;
  $('prog').firstElementChild.style.width = Math.min(el / runDur, 1) * 100 + '%';
  const left = Math.max(0, Math.ceil(runDur - el));
  $('clock').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  if (el >= runDur) stop();
}

function stop() {
  clearInterval(timer);
  $('prog').hidden = true;
  $('durSel').disabled = false;
  $('clock').textContent = ticks.length ? 'captured ' + ticks.length + ' ticks' : '';
  stream?.getTracks().forEach(t => t.stop());
  ctx?.close();
  ctx = stream = null;
  $('go').textContent = 'start'; $('go').className = ''; $('dot').className = '';
  render();
}

addEventListener('resize', () => drawFace(read(ticks, 52, 6)));
drawFace(null);
$('go').onclick = () => (ctx ? stop() : start());
</script>
</body>
</html>
